
mixed-port: 2080
allow-lan: true
mode: rule
log-level: info
ipv6: false

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "localhost.ptlogin2.qq.com"

# 【首选】全部交给国外最快的加密/非加密 DNS
  nameserver:
    - 8.8.8.8                # UDP 抢跑，极快
    - tls://1.1.1.1:853      # 安全加密

  nameserver-policy:
    "geosite:cn": 223.5.5.5
    "geosite:apple": 223.5.5.5 # 强制 Apple 走国内解析
    "geosite:netflix": 1.1.1.1

# 【回落】国内 DNS 放在备选位
  fallback:
    - 223.5.5.5
    - 119.29.29.29

# 【关键：反向判定】
  fallback-filter:
    geoip: true
    geoip-code: CN       # 如果 nameserver 解析出的是中国 IP，则判定为无效
    ipcidr:
      - 240.0.0.0/4

# 强制这些国内大厂域名只听 fallback (国内 DNS) 的
    domain:
      - "+.baidu.com"
      - "+.taobao.com"
      - "+.tmall.com"
      - "+.jd.com"
      - "+.qq.com"

proxies:
  - name: PROXY
    type: vless
    server: 202.91.34.226
    port: 42147
    uuid: d976ef13-b495-4926-8633-bf00048e08d0
    network: tcp
    udp: true
    tls: true
    flow: xtls-rprx-vision

    servername: www.microsoft.com
    client-fingerprint: chrome

    reality-opts:
      public-key: zX2-cyTjsKzyF3iVbe2-cdpEYlMNqnUyUULG8ZxxSjs
      short-id: 190fda

proxy-groups:

  - name: GROUPS
    type: select
    proxies:
      - PROXY
      - DIRECT

