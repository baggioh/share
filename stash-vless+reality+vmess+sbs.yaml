        Host: www.baggioh.sbs

# 🎯 第二步：在“澳洲看球专线”里把两个节点都塞进去，方便随时切换
proxy-groups:
  - name: GROUPS
    type: select
    proxies:
      - PROXY
      - "Vultr-澳大利亚-SBS"
      - DIRECT
  - name: 澳洲看球专线
    type: select
    proxies:
      - "Vultr-澳大利亚-SBS"  # 👈 现阶段把它点亮作为主力
      - DIRECT

