mixed-port: 2080
allow-lan: true
mode: rule
log-level: info
ipv6: false

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - localhost.ptlogin2.qq.com
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver-policy:
    "siliconflow.cn": 223.5.5.5
    "api.siliconflow.cn": 223.5.5.5
    "bigmodel.cn": 223.5.5.5
    "open.bigmodel.cn": 223.5.5.5

# 🎯 第一步：在 proxies 列表里把山海和 Vultr 并排保留
proxies:
  - name: PROXY
    type: vless
    server: 202.91.34.226
    port: 24844
    uuid: 35ba08c1-9a82-4608-a64e-5d23587503b8
    network: tcp
    udp: true
    tls: true
    servername: www.amazon.com
    client-fingerprint: chrome
    reality-opts:
      public-key: 89otapwMg_BjUj8GjnGK_W25xLKr_as5xtIOwhFYxV8
      short-id: a673


  - name: "Vultr-澳大利亚-SBS"
    type: vmess
    server: www.baggioh.sbs
    port: 443
    uuid: cb74bbb0-e85a-4aea-a902-bbb92d0482ef
    alterId: 0
    cipher: auto
    tls: true
    network: ws
    ws-opts:
      path: /cb74bbb0-e85a-4aea-a902-bbb92d0482ef
