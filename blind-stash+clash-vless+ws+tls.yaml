mixed-port: 2080
allow-lan: true
mode: rule
log-level: info
ipv6: false

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "localhost.ptlogin2.qq.com"

  nameserver:
    - 119.29.29.29          # 腾讯
    - 223.5.5.5             # 阿里
    - 8.8.8.8

  nameserver-policy:
    "geosite:cn": 223.5.5.5
    "geosite:apple": 223.5.5.5 

  fallback:
    - https://8.8.8.8/dns-query       # Google DoH
    - https://1.1.1.1/dns-query

  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4

# ----------------- 终极降维打击：DNS 静态优选映射 -----------------
hosts:
  'node.baggioh.dpdns.org': [104.16.160.1, 104.17.160.1, 104.18.160.1, 104.19.160.1, 104.20.160.1, 104.21.160.1, 104.22.160.1, 162.159.200.1, 198.41.212.1, 172.67.74.1, 104.16.88.1, 104.17.88.1]

# ----------------- 你的物理基础节点（无代理前缀，干净纯洁） -----------------
proxies:
  - name: "Hostdare-CF-Tunnel"
    type: vless
    server: node.baggioh.dpdns.org
    port: 443
    uuid: 329c60ac-0b14-45ed-bd8a-b547a0576105
    udp: true
    tls: true
    skip-cert-verify: false
    servername: node.baggioh.dpdns.org
    network: ws
    ws-opts:
      path: /baggioh
      headers:
        Host: node.baggioh.dpdns.org

# ----------------- 策略组控制台 -----------------
proxy-groups:
  - name: PROXY
    type: select
    proxies:
      - "Hostdare-CF-Tunnel"
      - DIRECT

